# Local development infrastructure.
# Start:  pnpm db:up     Stop:  pnpm db:down     Logs:  pnpm db:logs
# GUI client: DBeaver → PostgreSQL, localhost:5432, db/user/password from .env
name: milcow

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension pre-installed
    image: pgvector/pgvector:pg17
    container_name: milcow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milcow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milcow}
      POSTGRES_DB: ${POSTGRES_DB:-milcow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432' # host:container
    volumes:
      - milcow-pgdata:/var/lib/postgresql/data # data survives container restarts
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro # runs once, on first start
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-milcow} -d ${POSTGRES_DB:-milcow}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  milcow-pgdata:
