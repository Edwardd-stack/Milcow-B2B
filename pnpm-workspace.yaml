packages:
  - 'apps/*'
  - 'packages/*'

# One place for shared dependency versions.
# Packages reference them with "catalog:" instead of a version number.
catalog:
  typescript: ^6.0.2
  eslint: ^9
  # Prisma CLI and client must always be the same version
  prisma: ^7.10.1
  '@prisma/client': ^7.10.1
  '@prisma/adapter-pg': ^7.10.1

# Which dependencies may run install scripts (postinstall).
# Deny by default; allow only what the project really needs.
allowBuilds:
  '@parcel/watcher': false # file watcher used by next-intl tooling — prebuilt binary is used
  '@prisma/engines': true # downloads the schema engine used by prisma migrate
  '@scarf/scarf': false # Swagger UI telemetry — not needed
  '@swc/core': false # fast TS/JS compiler used by next-intl tooling — prebuilt binary is used
  esbuild: false # bundler binary — prebuilt binary is used
  prisma: true # Prisma CLI setup (official requirement)
  sharp: false # Next.js image optimizer — prebuilt binaries are used, no script needed
  unrs-resolver: false # ESLint import resolver — prebuilt binaries are used
  workerd: false # runtime for the local "prisma dev" server — not used (we run PostgreSQL in Docker)
